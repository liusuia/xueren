server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: xueren-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xueren?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:xueren123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # 生产环境建议通过环境变量设置（逗号分隔）
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

xueren:
  jwt:
    # 生产环境必须设置 JWT_SECRET 环境变量（openssl rand -base64 64）
    secret: ${JWT_SECRET:xueren-jwt-secret-key-change-in-production-2026}
    access-expire-minutes: 120
    refresh-expire-days: 1  # 24小时后需重新登录
  upload:
    dir: uploads
  netty:
    port: 8081
    path: /ws

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
